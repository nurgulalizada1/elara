[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "elara"
version = "0.2.0"
description = "ELARA - a local-first, privacy-first personal AI assistant (Azerbaijani-first)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.2"]
voice = ["sounddevice>=0.4", "numpy>=1.26", "faster-whisper>=1.0"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
elara = "elara.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/elara"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = ["live: hits real external APIs (skipped unless ELARA_LIVE_TESTS=1)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]
# SQL is built only from constant fragments and "?" placeholders; values are always bound.
"src/elara/memory/store.py" = ["S608"]
# Message catalogue and regex tables: long literal lines are clearer unbroken.
"src/elara/conversation/i18n.py" = ["E501"]
"src/elara/security/injection.py" = ["E501"]
