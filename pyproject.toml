[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elara"
version = "0.1.0"
description = "ELARA — Personal AI Operating System"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
elara = "elara.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
